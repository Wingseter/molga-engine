name: CI

on:
  push:
    branches: [main, phase4, phase6]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 60

  sanitizers:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 120
