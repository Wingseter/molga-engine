name: CI

on:
  push:
    branches: [main, phase4, phase6]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(sysctl -n hw.ncpu)
      - name: Run unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit -LE smoke --output-on-failure
      - name: Run playable editor smoke
        run: ctest --preset ${{ matrix.preset }} -L smoke --output-on-failure
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.preset }}-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/smoke-e2e/editor-report.json
            build/${{ matrix.preset }}/smoke-e2e/runtime-report.json
            build/${{ matrix.preset }}/smoke-e2e/package/game.json
          if-no-files-found: ignore
  build-test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GLFW dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)
      - name: Run unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit -LE smoke --output-on-failure

  sanitizers:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(sysctl -n hw.ncpu)
      - name: Test
        # Run unit and internal smoke tests under sanitizers.
        # Exclude E2E smoke test (smoke_end_to_end) to avoid platform OpenGL driver conflicts under sanitizers.
        run: ctest --preset ${{ matrix.preset }} -LE e2e --output-on-failure
