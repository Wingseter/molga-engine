name: CI

on:
  push:
    branches: [main, phase4, phase6, finetune]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout pinned Marrow runtime
        uses: actions/checkout@v4
        with:
          repository: Wingseter/Maroow
          ref: e4d984535d72b60ad52097a2c067d65c7208b1b2
          path: _maroow
          submodules: recursive
      - name: Build pinned Marrow runtime
        run: |
          cmake -S _maroow -B _maroow/build -DCMAKE_BUILD_TYPE=${{ matrix.preset == 'release' && 'Release' || 'Debug' }} -DBUILD_TESTING=OFF
          cmake --build _maroow/build --target marrow_runtime -j$(sysctl -n hw.ncpu)
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMOLGA_MARROW_DIR=${{ github.workspace }}/_maroow
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(sysctl -n hw.ncpu)
      - name: Run unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit -LE smoke --output-on-failure
      - name: Run playable editor smoke
        run: ctest --preset ${{ matrix.preset }} -L smoke --output-on-failure
      - name: Run SDL platform contracts
        run: ctest --preset ${{ matrix.preset }} -L platform --output-on-failure
      - name: Run SDL_GPU Metal pixel gate
        run: ctest --preset ${{ matrix.preset }} -L pixel --output-on-failure
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.preset }}-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/smoke-e2e/editor-report.json
            build/${{ matrix.preset }}/smoke-e2e/runtime-report.json
            build/${{ matrix.preset }}/smoke-e2e/package/game.json
          if-no-files-found: ignore
  build-test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SDL desktop and Mesa dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb libx11-dev libxext-dev libxrandr-dev libxinerama-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev libdecor-0-dev libvulkan-dev
          mesa-vulkan-drivers
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)
      - name: Run unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit -LE "smoke|pixel|e2e" --output-on-failure
      - name: Run SDL and SDL_GPU Vulkan capability contracts
        run: xvfb-run -a ctest --preset ${{ matrix.preset }} -R "^(test_platform_sdl|test_gpu_sdl)$" --output-on-failure

  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: >-
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/windows --parallel
      - name: Run unit tests
        run: ctest --test-dir build/windows -L unit -LE "smoke|pixel|e2e" --output-on-failure
      - name: Run SDL platform and D3D12 GPU contracts
        run: ctest --test-dir build/windows -R "^(test_platform_sdl|test_gpu_sdl)$" --output-on-failure

  sanitizers:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout pinned Marrow runtime
        uses: actions/checkout@v4
        with:
          repository: Wingseter/Maroow
          ref: e4d984535d72b60ad52097a2c067d65c7208b1b2
          path: _maroow
          submodules: recursive
      - name: Build pinned Marrow runtime
        run: |
          cmake -S _maroow -B _maroow/build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          cmake --build _maroow/build --target marrow_runtime -j$(sysctl -n hw.ncpu)
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMOLGA_MARROW_DIR=${{ github.workspace }}/_maroow
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(sysctl -n hw.ncpu)
      - name: Test
        # Run unit and internal smoke tests under sanitizers.
        # Exclude the packaged GUI E2E from sanitizer lanes; it has a dedicated
        # macOS production gate above. Linux/Windows render E2E is NOT REQUIRED.
        run: ctest --preset ${{ matrix.preset }} -LE e2e --output-on-failure
