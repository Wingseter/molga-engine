name: CI

on:
  push:
    branches: [main, phase4, phase6]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        build-type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j$(sysctl -n hw.ncpu)

      - name: Run tests
        working-directory: build
        run: ctest --build-config ${{ matrix.build-type }} --output-on-failure --timeout 30

      - name: Upload build artifacts
        if: matrix.build-type == 'Release' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: molga-engine-macos-${{ github.sha }}
          path: |
            build/molga_engine
            build/molga_runtime
            build/Shaders/
            build/assets/
